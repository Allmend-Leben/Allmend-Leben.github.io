baseURL = "/"
languageCode = "de-CH"
defaultContentLanguage = "de"
title = "Allmend Leben"
theme = "venture"
enableRobotsTXT = true

[params]
  brand = "Allmend Leben"
  description = "Allmend Leben — gemeinschaftliches Leben als lebendige Allmend. Ein Ort gehört der Gemeinschaft, nicht der Spekulation. Menschen zuerst, dann der Ort. Erstes Vorhaben: Allmend Bern."
  # The venture's one warm accent — the family blue chrome stays.
  accent = "#C98A46"
  accentTint = "#F6EEE2"
  heroBg = "#F6EEE2"
  footerNote = "Allmend Leben — gemeinschaftliches Leben als lebendige Allmend"
  [params.navCta]
    label = "Mitmachen"
    url = "/mitmachen/"

[taxonomies]
  projekttyp = "projekttypen"

[[menu.main]]
  name = "Die Idee"
  url = "/idee/"
  weight = 10
[[menu.main]]
  name = "Projekte"
  url = "/projekte/"
  weight = 20
[[menu.main]]
  name = "Wissen"
  url = "/wissen/"
  weight = 30
[[menu.main]]
  name = "Aktuelles"
  url = "/aktuelles/"
  weight = 40

[[menu.footer]]
  name = "Mitmachen"
  url = "/mitmachen/"
  weight = 10
[[menu.footer]]
  name = "Kontakt"
  url = "/kontakt/"
  weight = 20

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
